name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1', 'pre']
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - version: 'nightly'
            os: ubuntu-latest
    continue-on-error: ${{ matrix.version == 'nightly' }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # REPL.TerminalMenus with the terminal functions of JuliaLang/julia#65081, from its binaries
  julia-pr:
    name: Julia PR 65081 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Julia from the pull request
        run: |
          curl -fsSL https://install.julialang.org | sh -s -- --yes
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - run: juliaup add pr65081
      - name: Check that the browser uses REPL.TerminalMenus
        run: julia +pr65081 --project -e 'using Pkg; Pkg.instantiate(); using DocBrowser, REPL; DocBrowser.TM === REPL.TerminalMenus || error("the copy was used")'
      - run: julia +pr65081 --project -e 'using Pkg; Pkg.test()'
