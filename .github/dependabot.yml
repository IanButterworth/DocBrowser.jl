version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns: ["*"]
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-julia-packages:
        patterns: ["*"]
